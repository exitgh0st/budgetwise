<button
  mat-icon-button
  [matMenuTriggerFor]="notificationsMenu"
  (menuOpened)="loadRecent()"
  [matBadge]="unreadCount()"
  matBadgeColor="warn"
  [matBadgeHidden]="unreadCount() === 0"
  aria-label="Notifications"
>
  <mat-icon>notifications</mat-icon>
</button>

<mat-menu #notificationsMenu="matMenu" class="notification-menu">
  <div class="notification-menu-panel">
    <div class="notification-menu-header">
      <span>Notifications</span>
      @if (unreadCount() > 0) {
        <span class="notification-count">{{ unreadCount() }} unread</span>
      }
    </div>

    @if (isLoading()) {
      <div class="notification-empty">Loading notifications...</div>
    } @else if (notifications().length === 0) {
      <div class="notification-empty">No notifications</div>
    } @else {
      @for (notification of notifications(); track notification.id) {
        <button
          mat-menu-item
          class="notification-item"
          [class.unread]="!notification.isRead"
          (click)="openNotification(notification)"
        >
          <span class="notification-dot" [class.hidden]="notification.isRead"></span>
          <div class="notification-copy">
            <span class="notification-title">{{ notification.title }}</span>
            <span class="notification-body">{{ notification.body }}</span>
            <span class="notification-time">
              {{ formatRelativeTime(notification.createdAt) }}
            </span>
          </div>
        </button>
      }
    }

    <mat-divider></mat-divider>

    <button
      mat-menu-item
      type="button"
      (click)="markAllRead()"
      [disabled]="unreadCount() === 0"
    >
      Mark all read
    </button>
  </div>
</mat-menu>
